apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linksy-ingress
  namespace: linksy
  annotations:
    kubernetes.io/ingress.class: nginx
    # Critical for Vite dev server WebSocket/HMR
    nginx.ingress.kubernetes.io/websocket-services: frontend-service
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Prevent buffering issues
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: linksy.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
